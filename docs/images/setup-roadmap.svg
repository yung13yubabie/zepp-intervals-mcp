<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1534" viewBox="0 0 1120 1534" role="img" aria-labelledby="title desc"><title id="title">Zepp × Intervals × ChatGPT：八步私人連接流程</title><desc id="desc">資料依序由 Zepp 進 Intervals，再經自己的私人 Sites MCP 到 ChatGPT。八步包括同步、API key、建私人 Site、安全設定、重新部署、活動驗證、選填日指標及日常停用。完整文字在 README 與 HTML 教學。</desc><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1120" height="1534" rx="0" fill="#f8f7ed"/><text x="40" y="48" font-size="16" font-weight="700" fill="#0a6b50">ZEPP × INTERVALS × CHATGPT</text><text x="40" y="102" font-size="35" font-weight="700" fill="#183b35">從手錶到自己的對話，照這 8 步走</text><text x="40" y="140" font-size="20" font-weight="400" fill="#52685d">公開的是教學；你的服務、金鑰與健康資料仍由你自己管理</text><rect x="40" y="173" width="244" height="116" rx="17" fill="#e5efe0" stroke="#ced9c4"/><text x="58" y="215" font-size="25" font-weight="700" fill="#0a6b50">Zepp</text><text x="58" y="252" font-size="17" font-weight="400" fill="#52685d">手機先同步手錶</text><text x="291" y="240" font-size="25" font-weight="400" fill="#0a6b50">→</text><rect x="316" y="173" width="244" height="116" rx="17" fill="#e5efe0" stroke="#ced9c4"/><text x="334" y="215" font-size="25" font-weight="700" fill="#0a6b50">Intervals.icu</text><text x="334" y="252" font-size="17" font-weight="400" fill="#52685d">先看得到來源資料</text><text x="567" y="240" font-size="25" font-weight="400" fill="#0a6b50">→</text><rect x="592" y="173" width="244" height="116" rx="17" fill="#e5efe0" stroke="#ced9c4"/><text x="610" y="215" font-size="25" font-weight="700" fill="#0a6b50">私人 Sites MCP</text><text x="610" y="252" font-size="17" font-weight="400" fill="#52685d">登入與擁有者檢查</text><text x="843" y="240" font-size="25" font-weight="400" fill="#0a6b50">→</text><rect x="868" y="173" width="244" height="116" rx="17" fill="#e5efe0" stroke="#ced9c4"/><text x="886" y="215" font-size="25" font-weight="700" fill="#0a6b50">你的 ChatGPT</text><text x="886" y="252" font-size="17" font-weight="400" fill="#52685d">按指定日期讀摘要</text><text x="40" y="324" font-size="18" font-weight="400" fill="#52685d">MCP 不替手錶同步；先完成 Zepp → Intervals，再設定後半段</text><rect x="40" y="356" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="60" y="375" width="45" height="40" rx="11" fill="#e5efe0"/><text x="67" y="403" font-size="20" font-weight="700" fill="#0a6b50">01</text><text x="119" y="404" font-size="24" font-weight="700" fill="#183b35">先把資料同步到 Intervals</text><text x="62" y="443" font-size="18" font-weight="400" fill="#52685d">手機 Zepp 同步 → Intervals 連線設定</text><text x="62" y="475" font-size="18" font-weight="400" fill="#52685d">找 Amazfit，選需要的下載項目並授權</text><text x="62" y="520" font-size="17" font-weight="600" fill="#0a6b50">完成：先核對一筆活動／一天日指標</text><text x="62" y="557" font-size="16" font-weight="400" fill="#a94728">卡住：資料沒進 Intervals，就先修這段</text><rect x="574" y="356" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="594" y="375" width="45" height="40" rx="11" fill="#e5efe0"/><text x="601" y="403" font-size="20" font-weight="700" fill="#0a6b50">02</text><text x="653" y="404" font-size="24" font-weight="700" fill="#183b35">找到自己的 API key</text><text x="596" y="443" font-size="18" font-weight="400" fill="#52685d">Intervals → Settings → 頁面底部</text><text x="596" y="475" font-size="18" font-weight="400" fill="#52685d">Developer Settings → API key 鉛筆 / view</text><text x="596" y="520" font-size="17" font-weight="600" fill="#0a6b50">完成：由你自己建立或查看 key</text><text x="596" y="557" font-size="16" font-weight="400" fill="#a94728">注意：別貼聊天、GitHub 或教學 HTML</text><rect x="40" y="608" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="60" y="627" width="45" height="40" rx="11" fill="#e5efe0"/><text x="67" y="655" font-size="20" font-weight="700" fill="#0a6b50">03</text><text x="119" y="656" font-size="24" font-weight="700" fill="#183b35">建立全新的私人 Site</text><text x="62" y="695" font-size="18" font-weight="400" fill="#52685d">把這個 repo 提供給支援 Sites 的助理</text><text x="62" y="727" font-size="18" font-weight="400" fill="#52685d">用合成資料測試，建立自己的 Site／插件</text><text x="62" y="772" font-size="17" font-weight="600" fill="#0a6b50">完成：私人部署成功，讀取仍是 false</text><text x="62" y="809" font-size="16" font-weight="400" fill="#a94728">卡住：先確認方案與工作區功能</text><rect x="574" y="608" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="594" y="627" width="45" height="40" rx="11" fill="#e5efe0"/><text x="601" y="655" font-size="20" font-weight="700" fill="#0a6b50">04</text><text x="653" y="656" font-size="24" font-weight="700" fill="#183b35">親自填安全設定</text><text x="596" y="695" font-size="18" font-weight="400" fill="#52685d">Sites 管理 → More actions → Settings</text><text x="596" y="727" font-size="18" font-weight="400" fill="#52685d">API key 選 Secret；填自己的 owner hash</text><text x="596" y="772" font-size="17" font-weight="600" fill="#0a6b50">完成：四項名稱與類型正確，先停用</text><text x="596" y="809" font-size="16" font-weight="400" fill="#a94728">注意：這不是網站內容頁或插件聊天室</text><rect x="40" y="860" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="60" y="879" width="45" height="40" rx="11" fill="#e5efe0"/><text x="67" y="907" font-size="20" font-weight="700" fill="#0a6b50">05</text><text x="119" y="908" font-size="24" font-weight="700" fill="#183b35">重新部署，再連插件</text><text x="62" y="947" font-size="18" font-weight="400" fill="#52685d">Save → 部署已核准保存版本 → 連插件</text><text x="62" y="979" font-size="18" font-weight="400" fill="#52685d">check_connection → get_data_health</text><text x="62" y="1024" font-size="17" font-weight="600" fill="#0a6b50">完成：固定回應與擁有者設定檢查通過</text><text x="62" y="1061" font-size="16" font-weight="400" fill="#a94728">注意：這還沒證明 key／資料同步成功</text><rect x="574" y="860" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="594" y="879" width="45" height="40" rx="11" fill="#e5efe0"/><text x="601" y="907" font-size="20" font-weight="700" fill="#0a6b50">06</text><text x="653" y="908" font-size="24" font-weight="700" fill="#183b35">先驗證一天、一筆活動</text><text x="596" y="947" font-size="18" font-weight="400" fill="#52685d">接受 API 條款並明確決定資料範圍</text><text x="596" y="979" font-size="18" font-weight="400" fill="#52685d">開通兩個 true 開關，Save 後重新部署</text><text x="596" y="1024" font-size="17" font-weight="600" fill="#0a6b50">完成：指定日的 ZEPP 活動摘要核對一致</text><text x="596" y="1061" font-size="16" font-weight="400" fill="#a94728">限制：每次最多 31 天；缺值不是 0</text><rect x="40" y="1112" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="60" y="1131" width="45" height="40" rx="11" fill="#e5efe0"/><text x="67" y="1159" font-size="20" font-weight="700" fill="#0a6b50">07</text><text x="119" y="1160" font-size="24" font-weight="700" fill="#183b35">選填：睡眠、步數與 HRV</text><text x="62" y="1199" font-size="18" font-weight="400" fill="#52685d">確認整段日期都只來自 Zepp、未手改</text><text x="62" y="1231" font-size="18" font-weight="400" fill="#52685d">填四項日期限定聲明，Save 後重新部署</text><text x="62" y="1276" font-size="17" font-weight="600" fill="#0a6b50">完成：一天一欄核對；來源仍是本人聲明</text><text x="62" y="1313" font-size="16" font-weight="400" fill="#a94728">不確定／混合來源：保留 null 與封鎖</text><rect x="574" y="1112" width="506" height="232" rx="18" fill="#fffef8" stroke="#ced9c4"/><rect x="594" y="1131" width="45" height="40" rx="11" fill="#e5efe0"/><text x="601" y="1159" font-size="20" font-weight="700" fill="#0a6b50">08</text><text x="653" y="1160" font-size="24" font-weight="700" fill="#183b35">日常核對，知道怎樣停用</text><text x="596" y="1199" font-size="18" font-weight="400" fill="#52685d">先同步 Zepp → 開 Intervals → 核對資料</text><text x="596" y="1231" font-size="18" font-weight="400" fill="#52685d">再用 ChatGPT；新日期須重查來源聲明</text><text x="596" y="1276" font-size="17" font-weight="600" fill="#0a6b50">停用：將讀取開關改 false，Save 後重部署</text><text x="596" y="1313" font-size="16" font-weight="400" fill="#a94728">撤銷：回 Intervals 撤銷／輪替 key</text><rect x="40" y="1382" width="1040" height="110" rx="16" fill="#183b35"/><text x="63" y="1416" font-size="23" font-weight="700" fill="#fff8df">每天想看睡眠：先開 Intervals，別只重問 ChatGPT</text><text x="63" y="1448" font-size="18" font-weight="400" fill="#dbe7d2">wellness 有自己的輪詢機制；MCP 不會強制更新 Zepp，也沒有自動排程</text><text x="63" y="1476" font-size="14" font-weight="400" fill="#bcd2b1">流程示意，非真實帳戶截圖 ｜ 核對版本 c59fe7a · 2026-10-05</text></g></svg>