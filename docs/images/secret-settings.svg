<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="808" viewBox="0 0 1120 808" role="img" aria-labelledby="title desc"><title id="title">Sites 安全設定：API key 選 Secret，Save 後重新部署</title><desc id="desc">在 Sites 管理列表找自己的網站，More actions 到 Settings。INTERVALS_API_KEY 必須是 Secret。自己的 owner hash 建議 Secret；讀取與條款開關初始 false。儲存後重新部署已核准保存版本。</desc><g font-family="Noto Sans CJK TC, PingFang TC, Microsoft JhengHei, sans-serif"><rect x="0" y="0" width="1120" height="808" rx="0" fill="#f8f7ed"/><text x="40" y="49" font-size="33" font-weight="700" fill="#183b35">最容易卡住的地方：API key 要填在這裡</text><text x="40" y="90" font-size="23" font-weight="700" fill="#0a6b50">Sites 管理列表 → 找自己的 Site → More actions → Settings</text><rect x="40" y="117" width="1040" height="64" rx="12" fill="#e5efe0" stroke="#ced9c4"/><text x="62" y="157" font-size="22" font-weight="600" fill="#183b35">① Sites 管理設定 ✓       ② 網站內容頁 ✗       ③ 插件聊天室 ✗</text><rect x="40" y="211" width="490" height="427" rx="18" fill="#fffef8" stroke="#ced9c4"/><text x="62" y="248" font-size="20" font-weight="700" fill="#0a6b50">設定表單示意 · 不是可輸入欄位</text><text x="64" y="289" font-size="15" font-weight="400" fill="#52685d">Name / 名稱</text><rect x="63" y="306" width="442" height="46" rx="7" fill="#f0f3e9" stroke="#ced9c4"/><text x="77" y="336" font-size="22" font-weight="600" fill="#183b35">INTERVALS_API_KEY</text><rect x="62" y="373" width="444" height="82" rx="10" fill="#fff0dc" stroke="#a94728"/><text x="78" y="404" font-size="15" font-weight="400" fill="#a94728">Type / 類型</text><text x="78" y="436" font-size="26" font-weight="700" fill="#a94728">Secret  ← 一定選這個</text><text x="64" y="488" font-size="15" font-weight="400" fill="#52685d">Value / 值</text><rect x="63" y="502" width="442" height="50" rx="7" fill="#f0f3e9" stroke="#ced9c4"/><text x="76" y="534" font-size="20" font-weight="400" fill="#52685d">〔在真正的 Site 設定中親自填〕</text><rect x="63" y="573" width="107" height="41" rx="8" fill="#0a6b50"/><text x="89" y="602" font-size="20" font-weight="700" fill="#fffefa">Save</text><text x="560" y="241" font-size="24" font-weight="700" fill="#183b35">另外三項，也要一起填</text><rect x="555" y="273" width="525" height="102" rx="12" fill="#eef2e6" stroke="#ced9c4"/><text x="574" y="303" font-size="19" font-weight="600" fill="#183b35">OWNER_EMAIL_SHA256</text><text x="574" y="333" font-size="15" font-weight="600" fill="#0a6b50">建議 Secret</text><text x="574" y="360" font-size="17" font-weight="400" fill="#52685d">填登入 Site 的 ChatGPT email 指紋</text><rect x="555" y="388" width="525" height="102" rx="12" fill="#eef2e6" stroke="#ced9c4"/><text x="574" y="418" font-size="19" font-weight="600" fill="#183b35">INTERVALS_READ_ENABLED</text><text x="574" y="448" font-size="15" font-weight="600" fill="#0a6b50">一般變數</text><text x="574" y="475" font-size="17" font-weight="400" fill="#52685d">初始 false，準備開通才改 true</text><rect x="555" y="503" width="525" height="102" rx="12" fill="#eef2e6" stroke="#ced9c4"/><text x="574" y="533" font-size="19" font-weight="600" fill="#183b35">INTERVALS_API_TERMS_ACCEPTED</text><text x="574" y="563" font-size="15" font-weight="600" fill="#0a6b50">一般變數</text><text x="574" y="590" font-size="17" font-weight="400" fill="#52685d">初始 false，接受條款後才改 true</text><text x="561" y="630" font-size="18" font-weight="400" fill="#52685d">指紋在本機算：npm run owner:hash</text><rect x="40" y="663" width="1040" height="107" rx="15" fill="#183b35"/><text x="62" y="701" font-size="24" font-weight="700" fill="#fff8df">Save 只儲存設定 → 重新部署已核准保存版本 → 等成功後再測</text><text x="62" y="735" font-size="19" font-weight="400" fill="#dbe7d2">不要把 key 放聊天、GitHub、附件、前端、hosting.json 或教學 HTML</text><text x="40" y="795" font-size="14" font-weight="400" fill="#52685d">介面示意，實際以帳戶畫面為準；所有值皆為說明，沒有任何真實金鑰或帳戶資料</text></g></svg>